# Scheduled AI-readiness check for your own site.
# Fork this repo (or copy this file + the geo-visibility/scripts/ folder into any repo),
# set the GEO_DOMAIN repository variable (Settings → Secrets and variables →
# Actions → Variables), and get a readiness report in the Actions summary
# every Monday — plus on demand via "Run workflow".
#
# Notes:
#  * GitHub does not run scheduled workflows on a fork until you open the Actions tab and enable
#    workflows, and it pauses schedules after 60 days without repository activity.
#  * The runner uses datacenter IPs. If your WAF challenges them, the run reports "homepage returned
#    HTTP 403" and stops rather than producing fake findings; allowlist the runner or use a self-hosted one.
#  * The run fails when a check fails (a refused AI crawler, missing sitemap, noindex...), when the
#    site is unreachable and when the homepage returns an HTTP error.

name: AI Readiness Check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to check (e.g. example.com)"
        required: false
      paths:
        description: "Space-separated detail paths to compare across agents (e.g. /pricing /blog/my-post)"
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AI readiness check
        env:
          DOMAIN: ${{ inputs.domain || vars.GEO_DOMAIN }}
          # Optional: 3-5 representative detail pages, so the check can compare what a browser, a
          # listed crawler, unlisted AI user-fetch agents, Googlebot and Bingbot each receive (set the GEO_PATHS variable).
          PATHS: ${{ inputs.paths || vars.GEO_PATHS }}
          # Optional: your IndexNow key, to verify the key file at https://<domain>/<key>.txt (set the GEO_INDEXNOW_KEY variable).
          INDEXNOW_KEY: ${{ vars.GEO_INDEXNOW_KEY }}
        run: |
          # Propagate the script's exit code through `tee` (1 = failed checks, 2 = unreachable, 3 = homepage HTTP error)
          set -o pipefail
          if [ -z "$DOMAIN" ]; then
            echo "::error::Set the GEO_DOMAIN repository variable or pass a domain input."
            exit 1
          fi
          args=()
          if [ -n "$INDEXNOW_KEY" ]; then
            args+=(--indexnow-key "$INDEXNOW_KEY")
          fi
          # $PATHS is intentionally unquoted so it splits into separate arguments; globbing is off so "*" stays literal
          set -f
          python3 geo-visibility/scripts/check_ai_readiness.py "$DOMAIN" --paths $PATHS \
            "${args[@]}" --json readiness.json --fail-on fail | tee -a "$GITHUB_STEP_SUMMARY"
